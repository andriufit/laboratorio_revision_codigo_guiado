# mis-reglas.yaml — reglas propias de clase (fuente -> sumidero)
# Para practicar: semgrep scan --config mis-reglas.yaml .
# Se escriben EN VIVO en la practica 3; este fichero es la referencia completa.
rules:
  # ---- Node: path traversal ----
  - id: nodo-path-traversal
    mode: taint
    languages: [javascript]
    severity: ERROR
    message: >
      Un dato de req.query llega a fs.readFileSync/fs.readFile sin validar.
      Un atacante puede usar ../ para leer ficheros arbitrarios del servidor
      (path traversal, OWASP A01:2025 Broken Access Control).
    pattern-sources:
      - pattern: req.query.$K
    pattern-sinks:
      - pattern: fs.readFileSync($X, ...)
      - pattern: fs.readFile($X, ...)

  # ---- Node: eval() con datos del usuario ----
  - id: nodo-eval-con-usuario
    mode: taint
    languages: [javascript]
    severity: ERROR
    message: >
      Un dato de req.query llega a eval(). Un atacante puede ejecutar
      codigo JavaScript arbitrario en el servidor (OWASP A06 o A03, segun el caso).
    pattern-sources:
      - pattern: req.query.$K
    pattern-sinks:
      - pattern: eval($X)

  # ---- Node: inyeccion de comandos ----
  - id: nodo-inyeccion-comandos
    mode: taint
    languages: [javascript]
    severity: ERROR
    message: >
      Un dato de req.query se concatena en child_process.exec().
      Un atacante puede inyectar comandos del sistema operativo
      (OWASP A03:2025 Injection).
    pattern-sources:
      - pattern: req.query.$K
    pattern-sinks:
      - pattern: exec($X, ...)
      - pattern: child_process.exec($X, ...)

  # ---- PHP: inyeccion SQL ----
  - id: php-sqli-concatenado
    mode: taint
    languages: [php]
    severity: ERROR
    message: >
      Dato de $_GET/$_POST llega a mysqli_query() sin parametrizar.
      Inyeccion SQL clasica: la consulta se construye concatenando
      la entrada del usuario (OWASP A03:2025 Injection).
    pattern-sources:
      - pattern: $_GET[$K]
      - pattern: $_POST[$K]
    pattern-sinks:
      - pattern: mysqli_query($C, $Q)

  # ---- PHP: path traversal con readfile ----
  - id: php-path-traversal-readfile
    mode: taint
    languages: [php]
    severity: ERROR
    message: >
      Dato de $_GET llega a readfile()/include()/require() sin validar.
      Un atacante puede leer o ejecutar ficheros arbitrarios
      (OWASP A01:2025 Broken Access Control).
    pattern-sources:
      - pattern: $_GET[$K]
      - pattern: $_POST[$K]
    pattern-sinks:
      - pattern: readfile($X)
      - pattern: include($X)
      - pattern: require($X)
      - pattern: require_once($X)
      - pattern: include_once($X)
